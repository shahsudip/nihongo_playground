<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Memoji / Avatar Lip-Sync</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle, #e0e0e0, #999);
            font-family: sans-serif;
        }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        input[type="text"] {
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 350px;
            outline: none;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            background: #000;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
    <!-- We use an import map to load Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">Loading 3D Avatar...</div>

    <div id="ui-container">
        <input type="text" id="textInput" value="こんにちは！私は３Dアバターです。">
        <button id="speakBtn">Speak! 🗣️</button>
    </div>

    <!-- The 3D Canvas will be injected here by Three.js -->

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        
        // Setup Camera
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 3); // Position camera looking at face

        // Setup Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // Add Controls (allows you to drag to rotate the avatar)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.5, 0); // Look at the head
        controls.enablePan = false;
        controls.minDistance = 1;
        controls.maxDistance = 5;
        controls.update();

        // 2. LIGHTING (Crucial for Memoji style)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(1, 2, 3);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 1);
        backLight.position.set(-1, 2, -3);
        scene.add(backLight);

        // 3. LOAD 3D AVATAR MODEL (RobotExpressive)
        const modelUrl = './robot.glb';
        
        let avatar, headMesh;
        let morphTargets = {};

        const loader = new GLTFLoader();
        loader.load(modelUrl, (gltf) => {
            avatar = gltf.scene;
            
            // Adjust position and scale for the robot
            avatar.position.set(0, -2, 0); 
            scene.add(avatar);

            // Find the head mesh to access facial morph targets
            avatar.traverse((node) => {
                if (node.isMesh && node.morphTargetDictionary) {
                    console.log("Morph Targets found:", node.morphTargetDictionary);
                    headMesh = node;
                    morphTargets = node.morphTargetDictionary;
                }
            });

            document.getElementById('loading').style.display = 'none';
        }, 
        (progress) => {
            console.log('Loading progress:', (progress.loaded / progress.total) * 100 + '%');
        }, 
        (error) => {
            console.error('Error loading model:', error);
            document.getElementById('loading').innerText = "Failed to load 3D model.";
        });

        // 4. LIP SYNC LOGIC
        // Map Japanese vowels to the Robot's Blendshapes
        const targetInfluences = {
            Surprised: 0,
            Smile: 0
        };

        function resetMouth() {
            targetInfluences.Surprised = 0;
            targetInfluences.Smile = 0;
        }

        function setVowelShape(vowel) {
            resetMouth();
            switch(vowel) {
                case 'a': 
                    targetInfluences.Surprised = 0.8; 
                    break;
                case 'i': 
                    targetInfluences.Smile = 1.0; 
                    break;
                case 'u': 
                    targetInfluences.Surprised = 0.4; 
                    break;
                case 'e': 
                    targetInfluences.Surprised = 0.5;
                    targetInfluences.Smile = 0.5;
                    break;
                case 'o': 
                    targetInfluences.Surprised = 1.0;
                    break;
                case 'n':
                    // default closed
                    break;
            }
        }

        // Japanese Parsing
        function getVowel(char) {
            if (!char) return 'default';
            const normalized = char.normalize('NFD')[0];
            const aChars = "あかさたなはまやらわアカサタナハマヤラワゃャぁァ";
            const iChars = "いきしちにひみりイキシチニヒミリぃィ";
            const uChars = "うくすつぬふむゆるウクスツヌフムユルぅゥゅュ";
            const eChars = "えけせてねへめれエケセテネヘメレぇェ";
            const oChars = "おこそとのほもよろをオコソトノホモヨロヲぉォょョ";
            const nChars = "んンっッ、。！？.!? ";
            
            if (aChars.includes(normalized)) return 'a';
            if (iChars.includes(normalized)) return 'i';
            if (uChars.includes(normalized)) return 'u';
            if (eChars.includes(normalized)) return 'e';
            if (oChars.includes(normalized)) return 'o';
            if (nChars.includes(normalized)) return 'n';
            return 'default';
        }

        // Handle Speak Button
        const speakBtn = document.getElementById('speakBtn');
        const textInput = document.getElementById('textInput');

        speakBtn.addEventListener('click', () => {
            if (!headMesh) return; // Model not loaded yet

            const text = textInput.value.trim();
            if (!text) return;

            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;

            resetMouth();

            utterance.onboundary = (event) => {
                if (event.name === 'word') {
                    const char = text.charAt(event.charIndex);
                    setVowelShape(getVowel(char));
                    
                    // Twitch mouth slightly between sounds
                    setTimeout(() => {
                        if (window.speechSynthesis.speaking) setVowelShape('n');
                    }, 120);
                }
            };

            const fallbackInterval = setInterval(() => {
                if (!window.speechSynthesis.speaking) {
                    clearInterval(fallbackInterval);
                    return;
                }
                if (Math.random() > 0.6) {
                   setVowelShape(['a', 'e', 'i', 'u', 'o', 'n'][Math.floor(Math.random() * 6)]);
                }
            }, 150);

            utterance.onend = () => {
                clearInterval(fallbackInterval);
                resetMouth();
            };
            
            utterance.onerror = () => {
                clearInterval(fallbackInterval);
                resetMouth();
            };

            window.speechSynthesis.speak(utterance);
        });

        // 5. ANIMATION LOOP (Smoothly interpolates morph targets)
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Smoothly animate the morph targets (blendshapes)
            if (headMesh && morphTargets) {
                const lerpSpeed = 0.4;
                
                if (morphTargets.Surprised !== undefined) {
                    headMesh.morphTargetInfluences[morphTargets.Surprised] += (targetInfluences.Surprised - headMesh.morphTargetInfluences[morphTargets.Surprised]) * lerpSpeed;
                }
                if (morphTargets.Smile !== undefined) {
                    headMesh.morphTargetInfluences[morphTargets.Smile] += (targetInfluences.Smile - headMesh.morphTargetInfluences[morphTargets.Smile]) * lerpSpeed;
                }

                // Add slight idle breathing/head movement
                const time = clock.getElapsedTime();
                avatar.rotation.y = Math.sin(time * 0.5) * 0.05; 
                avatar.position.y = -2 + Math.sin(time * 2) * 0.02; 
            }

            renderer.render(scene, camera);
        }

        // Start render loop
        resetMouth();
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
